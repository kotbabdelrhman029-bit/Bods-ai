name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/browser @capacitor/app @capacitor/geolocation @capacitor/local-notifications @capacitor-community/contacts
      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/android-setup.mjs
      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bods-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
